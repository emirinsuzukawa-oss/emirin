<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COMING SOON｜Emirin</title>

  <meta
    name="description"
    content="Emirin - AI × Web Creative Director / Designer"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        "Hiragino Sans",
        Meiryo,
        sans-serif;

      color: #202020;

      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(225, 228, 232, 0.8),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f5f5f5 100%
        );

      -webkit-font-smoothing: antialiased;
    }

    .coming-soon {
      width: 90%;
      text-align: center;
    }

    .logo {
      margin-bottom: 55px;

      font-size: 1.25rem;
      font-weight: 300;

      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;

      font-size: clamp(2.8rem, 9vw, 6.5rem);

      font-weight: 200;

      letter-spacing: 0.1em;

      line-height: 1.1;
    }

    .message {
      margin: 25px 0 40px;

      color: #666666;

      font-size: 0.95rem;

      letter-spacing: 0.06em;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 180px;

      padding: 13px 28px;

      color: #202020;

      text-decoration: none;

      border: 1px solid #202020;
      border-radius: 999px;

      font-size: 0.9rem;

      transition:
        color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease;
    }

    .button:hover {
      color: #ffffff;
      background: #202020;

      transform: translateY(-2px);
    }
  </style>
</head>


<body>

  <main class="coming-soon">

    <div class="logo">
      Emirin
    </div>

    <h1>
      COMING SOON
    </h1>

    <p class="message">
      このページは現在準備中です。
    </p>

    <a
      class="button"
      href="index.html"
    >
      HOMEへ戻る
    </a>

  </main>

</body>

</html>
